<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Dimensure Report Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;600;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: report-type picker on top, then one column of section cards; each card is a slice of paper with Include / Remove beside it. */
:root{
  --bg:#f4f6f9;--surface:#fff;--ink:#0e1e3a;--muted:#5a6780;--line:#dbe1ea;--chip:#eef1f6;
  --mint:#13b886;--mint-soft:#e3f7ef;--red:#c2412d;--red-soft:#fbe6e2;--amber:#b7791f;--amber-soft:#fbf0dc;--sel:#0e1e3a;--sel-ink:#fff;
  --f-display:"Archivo",system-ui,sans-serif;--f-body:"Source Sans 3",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1322;--surface:#121d31;--ink:#e7edf6;--muted:#97a4ba;--line:#24324b;--chip:#1b2840;--mint:#35d6a1;--mint-soft:#11352c;--red:#ef7b67;--red-soft:#3d1c17;--amber:#e3a94b;--amber-soft:#3a2c12;--sel:#35d6a1;--sel-ink:#07121f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1322;--surface:#121d31;--ink:#e7edf6;--muted:#97a4ba;--line:#24324b;--chip:#1b2840;--mint:#35d6a1;--mint-soft:#11352c;--red:#ef7b67;--red-soft:#3d1c17;--amber:#e3a94b;--amber-soft:#3a2c12;--sel:#35d6a1;--sel-ink:#07121f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
img{max-width:100%}[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0e1e3a}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
header.top{background:#0e1e3a;color:#e7edf6}
header.top .wrap{padding-block:20px 16px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;letter-spacing:.12em;font-size:15px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,5vw,32px);line-height:1.15;margin:4px 0 0}
.lede{color:#b9c4d6;margin:0;max-width:64ch}
nav.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.bar .row{display:flex;gap:10px;align-items:center;padding-block:8px;flex-wrap:wrap}
.who{font-size:14px;color:var(--muted)}.who b{color:var(--ink)}
.tabs{display:flex;gap:6px;margin-left:auto}
.pill{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.types{display:flex;gap:6px;overflow-x:auto;padding-block:2px 10px;scrollbar-width:thin}
.types button{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:6px 10px;font-size:13px;text-align:left;display:flex;flex-direction:column;gap:1px}
.types button small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.types button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.types button[aria-pressed="true"] small{color:inherit;opacity:.8}
.types button.done{border-color:var(--mint)}
.types .gl{flex:none;align-self:center;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 2px 0 6px}
.progress{height:4px;background:var(--line)}.progress i{display:block;height:100%;background:var(--mint);width:0;transition:width .3s}
.status{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-block:5px}
main .wrap{padding-block:16px 70px;display:flex;flex-direction:column;gap:18px}
.intro{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.intro h2{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.2}
.intro p{margin:0;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--chip);color:var(--muted)}
.tag.real{background:var(--mint-soft);color:var(--mint)}.tag.ex{background:var(--amber-soft);color:var(--amber)}.tag.mix{background:#e8eefb;color:#3b5ea8}.tag.idea{background:#efe6fb;color:#6b3fb5}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.bulk{display:flex;gap:6px;flex-wrap:wrap}
.bulk button{border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:5px 10px;font-size:13px}
.grp{display:flex;flex-direction:column;gap:12px;scroll-margin-top:150px}
.grp>h3{font-family:var(--f-display);font-size:19px;margin:6px 0 0;border-top:3px solid var(--ink);padding-top:10px}
.grp>h3 small{font-family:var(--f-body);font-weight:400;font-size:14px;color:var(--muted);margin-left:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;align-items:start}
.card.in{border-color:var(--mint);box-shadow:inset 4px 0 0 var(--mint)}.card.out{border-color:var(--red);box-shadow:inset 4px 0 0 var(--red)}
.card.out .paper{opacity:.45}
@media (max-width:620px){.card{grid-template-columns:1fr}}
.ch{display:flex;flex-direction:column;gap:4px;min-width:0}
.ch .t{font-weight:700;font-size:16px;line-height:1.3}
.ch .d{font-size:14px;color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.paper{background:#fff;color:#1d2433;border:1px solid #dfe3ea;border-radius:4px;padding:12px 14px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:12.5px;line-height:1.45;cursor:zoom-in;overflow:hidden;max-height:420px;position:relative;margin-top:6px}
.paper::after{content:"Tap to enlarge";position:absolute;right:6px;bottom:6px;font-size:11px;background:rgba(14,30,58,.8);color:#fff;border-radius:4px;padding:1px 6px}
.paper.tall{max-height:none}
.dec{display:flex;flex-direction:column;gap:6px}
@media (max-width:620px){.dec{flex-direction:row;flex-wrap:wrap}.dec .note{flex-basis:100%}}
.dec button.b{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:10px 12px;font-weight:700;font-size:15px;flex:1;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.dec button.b.inb[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:#04140e}
.dec button.b.outb[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.note summary{font-size:13px;color:var(--muted);cursor:pointer;list-style:none}.note summary::-webkit-details-marker{display:none}.note summary::before{content:"+ "}.note[open] summary::before{content:"– "}
.note textarea{width:100%;min-height:60px;margin-top:4px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--bg);color:var(--ink)}
/* paper contents */
.pp table{border-collapse:collapse;width:100%;margin:4px 0}
.pp th{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:#5b6475;text-align:left;border-bottom:1px solid #cfd5df;padding:4px 5px;font-weight:600}
.pp td{border-bottom:1px solid #eceff4;padding:5px;vertical-align:top}
.pp td.n{text-align:right;font-variant-numeric:tabular-nums}
.pp h4{margin:2px 0 4px;font-size:14px;color:#0e1e3a}.pp p{margin:3px 0}.pp ol,.pp ul{margin:2px 0;padding-left:18px}
.pp .cap{font-size:10.5px;color:#5b6475}
.pp .wm{font-weight:800;letter-spacing:.06em;font-size:17px;color:#0e1e3a}.pp .wm b{color:#13a37a}
.pp .hdr{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pp .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 12px;font-size:11.5px}.pp .meta span{display:block;color:#5b6475;font-size:10px}
.pp .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pp .tile{border:1px solid #dfe3ea;border-radius:6px;padding:6px 8px}.pp .tile b{display:block;font-size:22px;line-height:1.1}.pp .tile span{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#5b6475}
.pp .box{border:1px solid #dfe3ea;border-radius:6px;padding:8px 10px}.pp .box.warn{border-color:#e0a21b;background:#fdf6e6}
.pp .note-g{border-left:3px solid #13a37a;padding:6px 10px;background:#f5faf8;font-size:11.5px}
.pp .kv{display:grid;grid-template-columns:130px 1fr;gap:5px 12px}.pp .kv>div:nth-child(odd){color:#5b6475}
.pp .pc{font-size:10.5px;font-weight:700;border-radius:10px;padding:1px 7px;white-space:nowrap}.pp .pc.h{background:#fbe6e2;color:#c2412d}.pp .pc.m{background:#fbf0dc;color:#b7791f}.pp .pc.l{background:#e5eef8;color:#3b6ea8}
.pp .rs{font-weight:700;font-size:11px}.pp .rs.ok{color:#2f8f57}.pp .rs.fl{color:#b7791f}.pp .rs.bd{color:#c2412d}
.pp .hi{color:#c2412d}.pp .lo{color:#2f6db5}
.pp .kpi{display:flex;gap:10px;flex-wrap:wrap}.pp .kpi div{border:1px solid #dfe3ea;border-radius:6px;padding:8px 10px;flex:1;min-width:120px}.pp .kpi b{display:block;font-size:22px;color:#0e1e3a}.pp .kpi span{font-size:11px;color:#5b6475}
.pp .pg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.pp .pg div{color:#fff;font-weight:700;text-align:center;padding:10px 0;border-radius:4px}
.pp .qr{display:flex;gap:12px;align-items:center;border:1px solid #dfe3ea;border-radius:6px;padding:10px}.pp .qrc{width:70px;height:70px;flex:none;background:repeating-linear-gradient(90deg,#0e1e3a 0 6px,#fff 6px 10px),repeating-linear-gradient(0deg,#0e1e3a 0 5px,#fff 5px 9px);background-blend-mode:multiply;border:4px solid #fff;outline:2px solid #0e1e3a}
.pp .ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pp .ph2{height:90px;background:#eef1f6;border-radius:4px;margin-top:4px}
.pp .tabsx{display:flex;gap:6px;flex-wrap:wrap}.pp .tabsx span{border:1px solid #cfd5df;border-radius:12px;padding:2px 10px;font-size:11px}
.pp .fc{border-left:4px solid #c2412d;padding-left:8px}
.pp .foot{display:flex;justify-content:space-between;font-size:9.5px;color:#7a8394;border-top:1px solid #eceff4;padding-top:5px;margin-top:6px}
.pp svg text{font-family:"Helvetica Neue",Arial,sans-serif}.pp .svl{font-size:12px;fill:#1d2433}.pp .svs{font-size:10.5px;fill:#5b6475}.pp .svb{font-size:26px;font-weight:700;fill:#0e1e3a}
.pp .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pp .photos div{height:70px;background:#e8ebf0;border-radius:4px;display:flex;align-items:flex-end;padding:4px;font-size:10px;color:#5b6475}
.pp .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pp .sig div{border:1px solid #dfe3ea;border-radius:4px;padding:6px;font-size:11px;min-height:48px}.pp .sig span{display:block;color:#5b6475;font-size:10px}
.pp .contents td:last-child{text-align:right}
/* compare */
.cmp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cmp .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cmp .cell{border:1px solid var(--line);border-radius:6px;padding:6px;font-size:14px;min-width:0;overflow-wrap:anywhere}
.cmp .cell b{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase}
.cmp .cell.in{background:var(--mint-soft)}.cmp .cell.out{background:var(--red-soft)}
.cmp .cell i{display:block;color:var(--muted);font-size:13px}
.ag{font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;align-self:flex-start}.ag.y{background:var(--mint-soft);color:var(--mint)}.ag.s{background:var(--amber-soft);color:var(--amber)}.ag.w{background:var(--chip);color:var(--muted)}
.ov{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.ov th,.ov td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.ov td.n{text-align:right;font-variant-numeric:tabular-nums}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.gate h2{font-family:var(--f-display);margin:0 0 6px}
/* lightbox */
.lb{position:fixed;inset:0;z-index:20;background:rgba(6,12,24,.92);display:flex;flex-direction:column}
.lb-bar{display:flex;gap:8px;align-items:center;color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.lb-bar span{flex:1;font-family:var(--f-mono);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-bar button{background:#1b2840;color:#fff;border:1px solid #33435f;border-radius:6px;padding:6px 12px}
.lb-body{flex:1;overflow:auto;padding:0 10px calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:flex-start}
.lb-body .paper{max-height:none;max-width:900px;width:100%;cursor:auto;font-size:14px}.lb-body .paper::after{display:none}
/*doc*/
/* ===== document view: the report as it would be issued, with a small review strip on each part ===== */
.doc{background:#fff;color:#1d2433;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1px #dfe3ea;font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;line-height:1.5;padding:22px clamp(14px,4vw,40px) 18px;display:flex;flex-direction:column;gap:10px;max-width:820px;width:100%;margin:0 auto}
.doclabel{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:6px}
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid #e3e7ee;padding-bottom:8px}
.dhead .wm{font-weight:800;letter-spacing:.06em;font-size:17px;color:#0e1e3a}.dhead .wm b{color:#13a37a}
.dhead .r{text-align:right;font-size:11px;color:#5b6475}
.dfoot{display:flex;justify-content:space-between;gap:10px;font-size:9.5px;color:#7a8394;border-top:1px solid #eceff4;padding-top:6px;margin-top:6px}
.part{position:relative;border-radius:4px;transition:opacity .15s}
.part>.body{padding:4px 0}
.part>.body h3.sh{font-size:15px;color:#0e1e3a;margin:6px 0 6px}
.part>.body table{border-collapse:collapse;width:100%}
.part>.body .tw{overflow-x:auto}
.part>.body th{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:#5b6475;text-align:left;border-bottom:1px solid #cfd5df;padding:4px 5px;font-weight:600;white-space:nowrap}
.part>.body td{border-bottom:1px solid #eceff4;padding:5px;vertical-align:top}
.part>.body td.n{text-align:right;font-variant-numeric:tabular-nums}
.part>.body img.fig{display:block;width:100%;border:1px solid #e3e7ee;cursor:zoom-in}
.part.out>.body{opacity:.28;filter:grayscale(1)}
.part.out{background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(194,65,45,.06) 10px 20px)}
.part.in{box-shadow:-6px 0 0 -2px #13a37a}
.part.out{box-shadow:-6px 0 0 -2px #c2412d}
/* review strip */
.rv{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-family:var(--f-body);font-size:12px;color:#5b6475;border-top:1px dashed #d5dbe4;padding:4px 0 0;margin-top:6px}
.rv .nm{font-weight:600;color:#7a8394;flex:1;min-width:0;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.rv .nm small{font-weight:400;color:#9aa3b2;margin-left:6px}
@media (max-width:560px){.rv .nm small{display:none}}
.rv .tg{font-size:10.5px;font-weight:700;border-radius:3px;padding:0 5px}
.rv .tg.real{background:#e3f7ef;color:#0f8a63}.rv .tg.ex{background:#fbf0dc;color:#9a6614}.rv .tg.idea{background:#efe6fb;color:#6b3fb5}
.rv button{border:1px solid #c9d0db;background:#fff;color:#0e1e3a;border-radius:5px;padding:3px 9px;font-size:12px;font-weight:700;line-height:1.3;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.rv button.k[aria-pressed="true"]{background:#13a37a;border-color:#13a37a;color:#fff}
.rv button.x[aria-pressed="true"]{background:#c2412d;border-color:#c2412d;color:#fff}
.rv button.nb[aria-pressed="true"]{background:#0e1e3a;color:#fff;border-color:#0e1e3a}
.rv textarea{flex-basis:100%;min-height:52px;font:inherit;font-size:13px;border:1px solid #c9d0db;border-radius:5px;padding:6px;color:#1d2433;background:#fff}
.pagebreak{height:0;border-top:2px dashed #cfd5df;margin:10px 0;position:relative}
.pagebreak span{position:absolute;right:4px;top:-9px;background:#fff;padding:0 6px;font-size:10px;color:#9aa3b2;font-family:var(--f-mono)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.toolbar button{border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:5px 10px;font-size:13px}


/* ===== export view: A4 pages exactly as the PDF would print, scaled to the screen, with small controls floating over each part ===== */
.stack{position:relative;margin:0 auto;overflow:hidden}
.a4 .part .hdr{display:none}
@media (max-width:560px){.ctl button{width:26px;height:24px;font-size:12px}}
.pages{transform-origin:0 0;position:absolute;left:0;top:0;width:794px;display:flex;flex-direction:column;gap:24px}
.a4{width:794px;height:1123px;background:#fff;color:#1d2433;box-shadow:0 1px 4px rgba(0,0,0,.25);font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;line-height:1.45;padding:34px 44px 28px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.a4 .ph{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #e3e7ee;padding-bottom:7px;margin-bottom:10px;flex:none}
.a4 .ph .wm{font-weight:800;letter-spacing:.06em;font-size:16px;color:#0e1e3a}.a4 .ph .wm b{color:#13a37a}
.a4 .ph .r{text-align:right;font-size:10px;color:#5b6475}
.a4 .pgc{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px;overflow:hidden}
.a4 .pf{flex:none;display:flex;justify-content:space-between;gap:10px;font-size:8.5px;color:#7a8394;border-top:1px solid #eceff4;padding-top:5px;margin-top:8px}
.a4 .dt{font-size:20px;font-weight:700;color:#0e1e3a;margin:0 0 2px}
.a4 .part{position:relative}
.a4 .part>.body h3.sh{font-size:14px;color:#0e1e3a;margin:2px 0 5px}
.a4 .part table{border-collapse:collapse;width:100%}
.a4 .part th{font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:#5b6475;text-align:left;border-bottom:1px solid #cfd5df;padding:3px 5px;font-weight:600}
.a4 .part td{border-bottom:1px solid #eceff4;padding:4px 5px;vertical-align:top}
.a4 .part td.n{text-align:right;font-variant-numeric:tabular-nums}
.a4 .part img.fig{display:block;max-width:100%;max-height:740px;margin:0 auto;border:1px solid #e3e7ee;cursor:zoom-in}
.a4 .part.out>.body{opacity:.25;filter:grayscale(1)}
.a4 .part.out{background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(194,65,45,.08) 10px 20px);outline:2px solid #c2412d;outline-offset:3px}
.a4 .part.in{outline:2px solid #13a37a;outline-offset:3px}
.ctl{position:absolute;display:flex;gap:3px;align-items:center;z-index:3}
.ctl .tg{font-size:10px;font-weight:700;border-radius:3px;padding:1px 5px;margin-right:2px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.ctl .tg.idea{background:#efe6fb;color:#6b3fb5}.ctl .tg.ex{background:#fbf0dc;color:#9a6614}

<script>
const $=s=>document.querySelector(s);

function common(T){

   {id:'c_next',g:'brief',t:'Next steps',d:'What happens after this report.',html:()=>`<h4>Next steps</h4><ol>${T.next.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`},
  ];
  const F1=[
   {id:'c_contents',g:'fe',t:'How to use this document and contents',d:'Short intro and a contents table with page numbers.',html:()=>`<p class="cap">How to use this document: each finding has its own write-up; the Brief lists them all.</p><table class="contents"><tr><th>ID</th><th>Finding</th><th style="text-align:right">Page</th></tr>${T.F.map(f=>`<tr><td><b>${f[0]}</b></td><td>${esc(f[2])}</td><td class="n">${f[4]}</td></tr>`).join('')}</table>`},

   {id:'c_passed',g:'app',t:'Checks that passed',d:'What was checked and found to be right.',html:()=>H.tbl(['Check','Result'],T.passed.map(p=>[esc(p[0]),esc(p[1])]))},

    A.push({id:'c_photos',g:'app',idea:1,t:'Site photo log',d:'Photos from the scan visit next to the findings they relate to.',html:()=>`<div class="photos"><div>M1 · Road 5 entrance</div><div>M2 · Road 4 kerbs</div><div>M4 · gully plate</div></div>`});}
  A.push({id:'c_signoff',g:'app',idea:1,t:'Checked and approved by',d:'Who prepared, checked and approved the report, with dates.',html:()=>`<div class="sig"><div><span>Prepared</span>[name]</div><div><span>Checked</span>[name]</div><div><span>Approved for issue</span>[name]</div></div>`});
  A.push({id:'c_revs',g:'app',idea:1,t:'Issue and revision history',d:'Each issue, date and what changed.',html:()=>H.tbl(['Issue','Date','Change'],[['1','[date]','First issue'],['1 rev 2','[date]','Updated after site team comments']])});
  A.push({id:'c_copy',g:'app',t:'Copyright & use of this report',d:'Short licence section plus the footer on every page.',html:()=>`<h4>Copyright &amp; use of this report</h4><p class="cap">This report is the property of Dimensure. [Client] is licensed to use it for ${esc(T.project)} once paid. It may not be copied, altered or shared beyond the project team without Dimensure's written consent. Only the issued version under ref ${esc(T.ref)} is valid. No third party may rely on it.</p>${foot(T)}`});
  return {B,F1,A};

function sectionsOf(T){
  if(T.noBrief){const out=[];['brief','fe','app'].forEach(g=>T.spec.filter(s=>s.g===g).forEach(s=>out.push(s)));return out}
  const c=common(T);return [...c.B,...T.spec.filter(s=>s.g==='brief'),...c.F1,...T.spec.filter(s=>s.g==='fe'),...T.spec.filter(s=>s.g==='app'),...c.A];
}
const GROUPS={brief:['Brief','page 1 onwards: the summary people act on'],fe:['Findings Explained','the detail, charts and drawings'],app:['Back pages','tables, checks, drawings list and copyright']};
const ALLSECS={};TYPES.forEach(T=>ALLSECS[T.id]=sectionsOf(T));

const API='https://ivmdqsxnnstvxcspdmov.supabase.co/rest/v1/rpc/';const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml2bWRxc3hubnN0dnhjc3BkbW92Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4Mzk4MjYsImV4cCI6MjEwODQxNTgyNn0.ICjJ5k_71mnzfgb1aQuT-rMMaoT2mpFBfvZTzG5R1tE';
async function rpc(fn,body){const r=await fetch(API+fn,{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){let m=r.status;try{m=(await r.json()).message||m}catch(e){}throw{code:m}}return r.json()}

function tagsHtml(s,T){const t=[];if(s.idea)t.push('<span class="tag idea">New idea</span>');if(s.ex)t.push('<span class="tag ex">Example data</span>');if(!s.idea&&!s.ex&&!s.id.startsWith('c_')&&T.sample[0]==='real')t.push('<span class="tag real">From a real report</span>');return t.join('')}

function tagHtml(s,T){if(s.idea)return '<span class="tg idea">New idea</span>';if(s.ex)return '<span class="tg ex">Example data</span>';if(!s.id.startsWith('c_')&&T.sample[0]!=='ex')return '<span class="tg real">Real</span>';return ''}

let hideRemoved=false,sheetFor=null;
function partEl(T,s){const ch=(choices[T.id]||{})[s.id]||{};const el=document.createElement('div');el.className='part'+(ch.v?' '+ch.v:'');el.dataset.sid=s.id;el.innerHTML=`<div class="body">${bodyHtml(s)}</div>`;el.querySelectorAll('img.fig').forEach(im=>im.onclick=()=>openLB(s));return el}
function newPage(T,title,docName){const pg=document.createElement('section');pg.className='a4 pp';
  pg.innerHTML=`<div class="ph"><div class="wm">DIMEN<b>SURE</b></div><div class="r">${esc(docName||T.title)}<br>Ref ${esc(T.ref)} · Issue 1 · [date]</div></div><div class="pgc"></div><div class="pf"><span>© 2026 Dimensure. Confidential — issued to [client] for ${esc(T.project)}. Ref ${esc(T.ref)}, issue 1.</span><span class="pn"></span></div>`;

function paginate(T,host){

  const runs=T.noBrief?[[null,secs,T.name]]:[[null,secs.filter(s=>s.g==='brief'),'Brief'],['Findings Explained',secs.filter(s=>s.g!=='brief'),'Findings Explained']];
  const pages=[];
  runs.forEach(([title,list,dn])=>{if(!list.length)return;let pg=newPage(T,title,dn);host.appendChild(pg);pages.push(pg);
    list.forEach(s=>{let pc=pg.querySelector('.pgc');const el=partEl(T,s);pc.appendChild(el);
      if(pc.scrollHeight>pc.clientHeight+1&&pc.children.length>1){el.remove();pg=newPage(T,null,dn);host.appendChild(pg);pages.push(pg);pg.querySelector('.pgc').appendChild(el)}});});

function placeControls(T,stack){stack.querySelectorAll('.ctl').forEach(c=>c.remove());const sr=stack.getBoundingClientRect();let lastBottom=-99;const CH=window.innerWidth<=560?26:30;
  stack.querySelectorAll('.part').forEach(el=>{const s=ALLSECS[T.id].find(x=>x.id===el.dataset.sid);const ch=(choices[T.id]||{})[s.id]||{};const r=el.getBoundingClientRect();
    const c=document.createElement('div');c.className='ctl';const tg=s.idea?'<span class="tg idea">New idea</span>':s.ex?'<span class="tg ex">Example</span>':'';
    c.innerHTML=`${tg}<button class="k" type="button" aria-pressed="${ch.v==='in'}" aria-label="Keep ${esc(s.t)}" title="Keep: ${esc(s.t)}">✓</button><button class="x" type="button" aria-pressed="${ch.v==='out'}" aria-label="Remove ${esc(s.t)}" title="Remove: ${esc(s.t)}">✕</button><button class="nb" type="button" aria-pressed="${ch.note?'true':'false'}" aria-label="Note on ${esc(s.t)}" title="Note">✎</button>`;
    let top=Math.max(0,r.top-sr.top-4);if(top<lastBottom+3)top=lastBottom+3;lastBottom=top+CH;c.style.top=top+'px';c.style.right=Math.max(2,sr.right-r.right-2)+'px';
    const set=v=>{if(!me)return;choices[T.id]=choices[T.id]||{};const cc=choices[T.id][s.id]=choices[T.id][s.id]||{};cc.v=cc.v===v?'':v;el.className='part'+(cc.v?' '+cc.v:'');c.querySelector('.k').setAttribute('aria-pressed',cc.v==='in');c.querySelector('.x').setAttribute('aria-pressed',cc.v==='out');queueSave();if(hideRemoved&&cc.v==='out')render()};
    c.querySelector('.k').onclick=()=>set('in');c.querySelector('.x').onclick=()=>set('out');c.querySelector('.nb').onclick=()=>openSheet(T,s,c.querySelector('.nb'));
    stack.appendChild(c)})}
function openSheet(T,s,btn){closeSheet();const ch=(choices[T.id]||{})[s.id]||{};const d=document.createElement('div');d.className='sheet';d.setAttribute('role','dialog');d.setAttribute('aria-label','Note');
  d.innerHTML=`<b>${esc(s.t)}</b><small>${esc(s.d)}</small><textarea placeholder="What to change">${esc(ch.note||'')}</textarea><div class="row"><button type="button">Done</button></div>`;document.body.appendChild(d);sheetFor=d;
  const ta=d.querySelector('textarea');ta.focus();ta.oninput=()=>{if(!me)return;choices[T.id]=choices[T.id]||{};const cc=choices[T.id][s.id]=choices[T.id][s.id]||{};cc.note=ta.value;btn.setAttribute('aria-pressed',cc.note?'true':'false');queueSave()};
  d.querySelector('button').onclick=closeSheet}
function closeSheet(){if(sheetFor){sheetFor.remove();sheetFor=null}}

function openType(id){cur=id;try{history.replaceState(null,'',id?'#'+id:location.pathname+location.search)}catch(e){}$('#back').hidden=!id;render();window.scrollTo({top:0})}
function renderHome(m){
  const box=document.createElement('div');box.className='home';
  box.innerHTML=`<div class="intro"><h2>Report types</h2><p>Each report type is its own document. Open one, keep or remove each part, then come back here for the next. Progress shows how many parts you have decided.</p></div>`;
  let g='',grid=null;
  TYPES.forEach(T=>{if(T.grp!==g){g=T.grp;const h3=document.createElement('h3');h3.textContent=g;box.appendChild(h3);grid=document.createElement('div');grid.className='hgrid';box.appendChild(grid)}
    const n=decidedIn(T.id),t=ALLSECS[T.id].length;const b=document.createElement('button');b.type='button';b.className='hcard'+(n===t?' done':'');
    b.innerHTML=`<b>${esc(T.name)}</b><span>${esc(T.about)}</span><div class="bar"><i style="width:${100*n/t}%"></i></div><div class="meta2"><span>${esc(T.code)}</span><span>${n} of ${t} decided</span></div>`;
    b.onclick=()=>openType(T.id);grid.appendChild(b)});
  m.appendChild(box)}
function endNav(m){const i=TYPES.findIndex(t=>t.id===cur);const nx=TYPES[i+1];const d=document.createElement('div');d.className='endnav';
  d.innerHTML=`<button type="button" id="e-back">‹ All reports</button>${nx?`<button type="button" id="e-next">Next: ${esc(nx.name)} ›</button>`:''}`;
  d.querySelector('#e-back').onclick=()=>openType(null);if(nx)d.querySelector('#e-next').onclick=()=>openType(nx.id);m.appendChild(d)}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);const id=TYPES.some(t=>t.id===h)?h:null;if(id!==cur){cur=id;$('#back').hidden=!id;render()}});
let fitFn=null;const LOADED=new Set();let renderSeq=0;
function render(){closeSheet();const m=$('#main');m.innerHTML='';if(view==='c'){renderCompare(m);status();return}
  if(!cur){fitFn=null;renderHome(m);status();return}
  const T=TYPES.find(t=>t.id===cur);const secs=ALLSECS[T.id];
  const intro=document.createElement('div');intro.className='intro';
  intro.innerHTML=`<span class="tag ${T.sample[0]}">${esc(T.sample[1])}</span><h2>${esc(T.name)}</h2><p>${esc(T.about)} Shown as one document, page by page, as it would export to PDF. Tap ✓ to keep or ✕ to remove each part; ✎ adds a note. Tap a drawing to see it full size.</p>
  <div class="viewbar"><button type="button" id="v-all" aria-pressed="${!hideRemoved}">Show everything</button><button type="button" id="v-exp" aria-pressed="${hideRemoved}">Preview without removed parts</button><button type="button" id="all-in">Keep every undecided part</button><button type="button" id="clear">Clear my choices</button></div>`;
  m.appendChild(intro);
  intro.querySelector('#v-all').onclick=()=>{hideRemoved=false;render()};intro.querySelector('#v-exp').onclick=()=>{hideRemoved=true;render()};
  intro.querySelector('#all-in').onclick=()=>{choices[T.id]=choices[T.id]||{};secs.forEach(s=>{const c=choices[T.id][s.id]=choices[T.id][s.id]||{};if(!c.v)c.v='in'});render();queueSave()};
  intro.querySelector('#clear').onclick=e=>{const b=e.target;if(b.dataset.armed){choices[T.id]={};render();queueSave()}else{b.dataset.armed=1;b.textContent='Tap again to clear';setTimeout(()=>{b.textContent='Clear my choices';delete b.dataset.armed},3000)}};
  const stack=document.createElement('div');stack.className='stack';const pagesBox=document.createElement('div');pagesBox.className='pages';stack.appendChild(pagesBox);m.appendChild(stack);
  // load every drawing first so each page is measured at its real size
  const srcs=[...new Set(ALLSECS[T.id].filter(s=>s.img).map(s=>s.img).concat(ALLSECS[T.id].some(s=>s.id==='c_keyplan')?['keyplan.jpg']:[]))];
  const ready=srcs.every(s=>LOADED.has(s));
  if(!ready){const w=document.createElement('p');w.className='empty';w.textContent='Laying out the pages…';m.appendChild(w);const my=++renderSeq;
    Promise.all(srcs.map(s=>new Promise(res=>{const im=new Image();im.onload=im.onerror=()=>{LOADED.add(s);res()};im.src=s;setTimeout(res,8000)}))).then(()=>{srcs.forEach(s=>LOADED.add(s));if(my===renderSeq&&cur===T.id&&view==='b')render()});return}
  const pages=paginate(T,pagesBox);endNav(m);
  fitFn=()=>{const cs=getComputedStyle(m);const w=Math.min(m.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),820);const s=Math.min(1,w/794);pagesBox.style.transform=`scale(${s})`;stack.style.width=(794*s)+'px';stack.style.height=(pagesBox.scrollHeight*s)+'px';placeControls(T,stack)};
  requestAnimationFrame(()=>fitFn());
  status()}
window.addEventListener('resize',()=>{if(fitFn&&view==='b')fitFn()});
function renderCompare(m){
  const ov=document.createElement('div');
  ov.innerHTML=`<div class="intro"><h2>Compare choices</h2><p>Everyone's Include / Remove for each section, refreshed every 20 seconds. Tap a report type to see its parts.</p></div>`;
  const tb=document.createElement('table');tb.className='ov';tb.innerHTML=`<tr><th>Report type</th>${PEOPLE.map(p=>`<th>${p.name}</th>`).join('')}<th>Agreed</th></tr>`+TYPES.map(T=>{const secs=ALLSECS[T.id];const per=PEOPLE.map(p=>{const c=(everyone[p.id]&&everyone[p.id].choices&&everyone[p.id].choices[T.id])||{};return secs.filter(s=>c[s.id]&&c[s.id].v).length});
    const agreed=secs.filter(s=>{const v=PEOPLE.map(p=>{const c=(everyone[p.id]&&everyone[p.id].choices&&everyone[p.id].choices[T.id])||{};return c[s.id]&&c[s.id].v}).filter(Boolean);return v.length===3&&new Set(v).size===1}).length;
    return `<tr><td>${esc(T.name)}</td>${per.map(n=>`<td class="n">${n}/${secs.length}</td>`).join('')}<td class="n">${agreed}</td></tr>`}).join('');
  ov.appendChild(tb);m.appendChild(ov);
  [...tb.querySelectorAll('tr')].slice(1).forEach((tr,i)=>{tr.style.cursor='pointer';tr.onclick=()=>{cur=TYPES[i].id;$('#back').hidden=false;render()}});
  if(!cur){const p=document.createElement('p');p.className='empty';p.textContent='Tap a report type in the table to see each part side by side.';m.appendChild(p);return}
  const T=TYPES.find(t=>t.id===cur);const h=document.createElement('h3');h.style.cssText='font-family:var(--f-display);margin:8px 0 0';h.textContent=T.name;m.appendChild(h);
  ALLSECS[T.id].forEach(s=>{const vals=PEOPLE.map(p=>((everyone[p.id]&&everyone[p.id].choices&&everyone[p.id].choices[T.id])||{})[s.id]||{});const vs=vals.map(v=>v.v).filter(Boolean);
    const ag=vs.length<2?'<span class="ag w">Waiting</span>':new Set(vs).size===1?`<span class="ag y">${vs.length===3?'All agree':'Agree so far'}: ${vs[0]==='in'?'Include':'Remove'}</span>`:'<span class="ag s">Split</span>';
    const c=document.createElement('div');c.className='cmp';c.innerHTML=`<b>${esc(s.t)}</b>${ag}<div class="row3">${PEOPLE.map((p,i)=>`<div class="cell ${vals[i].v||''}"><b>${p.name}</b>${vals[i].v==='in'?'Include':vals[i].v==='out'?'Remove':'–'}${vals[i].note?`<i>“${esc(vals[i].note)}”</i>`:''}</div>`).join('')}</div>`;m.appendChild(c)})}
function openLB(s){$('#lb-cap').textContent=s.t;const b=$('#lb-body');b.innerHTML=`<div class="paper pp"><img src="${esc(s.img)}" alt="" style="display:block;width:100%"></div>`;$('#lb').hidden=false;$('#lb-x').focus()}
$('#back').onclick=()=>openType(null);
$('#lb-x').onclick=()=>{$('#lb').hidden=true};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').hidden=true});
$('#tab-b').onclick=()=>{view='b';$('#tab-b').setAttribute('aria-pressed','true');$('#tab-c').setAttribute('aria-pressed','false');render()};
$('#tab-c').onclick=()=>{view='c';$('#tab-c').setAttribute('aria-pressed','true');$('#tab-b').setAttribute('aria-pressed','false');render()};

(async()=>{renderTypes();
  if(!CODE){$('#main').innerHTML='<div class="gate"><h2>Use your own link</h2><p>This page opens from the personal link Lewis sent you.</p></div>';$('#status').textContent='No personal link found';return}
  try{await refresh()}catch(e){$('#main').innerHTML='<div class="gate"><h2>This link is not working</h2><p>Check you opened the full link, or ask Lewis for a new one.</p></div>';$('#status').textContent='Link not recognised';return}
  $('#who').innerHTML=`Choosing as <b>${esc(PEOPLE.find(p=>p.id===me).name)}</b>`;renderTypes();
  setInterval(()=>{if(!saveT)refresh().catch(()=>{})},20000);
})();
</script>
</body></html>
