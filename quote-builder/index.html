<style>
:root{--bg:#F4F4F1;--card:#fff;--ink:#1B1F23;--body:#3D4247;--muted:#7A8086;--line:#E2E2DC;--accent:#2F6FEB;--ok:#2E8B57;--warn:#C2410C;--rd:#72AA23;--mkd:#C08A46;--claude:#F1EEE6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--body);font-family:Barlow,Arial,sans-serif;font-size:16px}
header{background:#1B1F23;color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px}
header a{color:#fff;text-decoration:none;font-size:22px;line-height:1}
header h1{font:700 19px 'Barlow Semi Condensed',Arial;margin:0;letter-spacing:.01em;flex:1}
header .new{font:600 14px Barlow,Arial;background:#fff;color:#1B1F23;border-radius:999px;padding:6px 12px}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px calc(110px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
h2{font:700 17px 'Barlow Semi Condensed',Arial;color:var(--ink);margin:0 0 8px}
h3{font:700 14px 'Barlow Semi Condensed',Arial;color:var(--muted);margin:18px 2px 4px;text-transform:uppercase;letter-spacing:.06em}
label{display:block;font-weight:600;color:var(--ink);font-size:14px;margin:12px 0 5px}
input[type=text],input[type=search],input[type=email],input[type=tel],textarea,select{width:100%;font:400 16px Barlow,Arial;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.btn{display:inline-block;border:0;border-radius:9px;background:var(--accent);color:#fff;font:600 16px Barlow,Arial;padding:12px 16px;cursor:pointer;text-decoration:none;text-align:center}
.btn.full{display:block;width:100%;margin-top:14px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 11px;font-size:14px}
.btn[disabled]{opacity:.45}
.muted{color:var(--muted);font-size:14px}
.row2{display:flex;gap:10px}.row2>div{flex:1}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:#EEE;color:#555;white-space:nowrap}
.pill.with_you{background:#FEF3C7;color:#92400E}.pill.with_claude,.pill.building{background:#E8F0FE;color:#1D4ED8}.pill.ready{background:#DCFCE7;color:#166534}.pill.closed{background:#F3F4F6;color:#6B7280}
.co{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.item{display:block;text-decoration:none;color:inherit;border-top:1px solid var(--line);padding:11px 0}
.item:first-child{border-top:0}
.item .t{font-weight:600;color:var(--ink);display:flex;justify-content:space-between;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;font:600 15px Barlow,Arial;padding:10px;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.msg{margin:12px 0;display:flex;flex-direction:column}
.msg .who{font-size:12px;color:var(--muted);margin:0 4px 3px}
.msg .b{border-radius:14px;padding:11px 13px;white-space:pre-wrap;line-height:1.4;max-width:92%}
.msg.lewis{align-items:flex-end}.msg.lewis .b{background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.msg.claude{align-items:flex-start}.msg.claude .b{background:var(--claude);color:var(--ink);border-bottom-left-radius:4px}
.msg .ans{margin-top:6px;font-size:14px;opacity:.9}
.msg .ans div{margin-top:3px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.tf{margin:0;width:110px;cursor:pointer}.tf img{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.tf figcaption{font-size:12px;color:var(--body);line-height:1.25;margin-top:3px;max-height:4.9em;overflow:hidden}
.msg.lewis .thumbs{justify-content:flex-end}
.pcard{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;background:#fff}
.pcard .pimg{width:96px;height:96px;object-fit:cover;border-radius:8px;flex:none;cursor:pointer}
.pcard .pbody{flex:1;min-width:0}.pcard textarea{min-height:58px;margin-top:6px;font-size:15px}
.pacts{display:flex;gap:6px;flex-wrap:wrap}

.q .qt{font-weight:600;color:var(--ink);margin-bottom:8px}
.q .qn{color:var(--muted);font-weight:600;margin-right:4px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff;font-size:15px;color:var(--ink);text-align:left}
.opt .mk{flex:none;width:20px;height:20px;border:2px solid #B8BCC0;border-radius:50%;margin-top:1px}
.opt.multi .mk{border-radius:5px}

.opt.on .mk{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px #EEF4FF}
.q input.other{margin-top:8px}

.err{color:var(--warn);font-size:14px;margin-top:8px;min-height:1em}

.photo-in{display:flex;align-items:center;gap:10px;margin-top:10px}

.cgrp{margin-top:12px}.cgh{display:flex;justify-content:space-between;font:700 13px 'Barlow Semi Condensed',Arial;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:3px}

.vwait{width:100%;aspect-ratio:4/3;border-radius:8px;border:1px dashed #B8BCC0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:14px;padding:10px;background:#FAFAF8}

.vrounds button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.vrounds button.ap{box-shadow:inset 0 0 0 2px var(--ok)}
.vins{font-size:14px;color:var(--body);margin-top:6px;white-space:pre-wrap}.pill.vok{background:#DCFCE7;color:#166534}.pill.vgo{background:#E8F0FE;color:#1D4ED8}.pill.vchk{background:#FEF3C7;color:#92400E}.pill.vbad{background:#FEE2E2;color:#991B1B}

@keyframes vspin{to{transform:rotate(360deg)}}.vsp{display:inline-block;width:14px;height:14px;border:2px solid #9DB7F5;border-top-color:transparent;border-radius:50%;animation:vspin .9s linear infinite;vertical-align:-2px;margin-right:6px}

<body>
<header><a href="/" aria-label="Back to the hub">‹</a><h1>Quote builder</h1><a class="new" href="?new=1" id="newBtn">+ New</a></header>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>

<script src="/sign/lib/supabase.js"></script>
<script type="module">
const { createClient } = window.supabase
const sb = createClient('https://bjkjmdqytughwczpzgac.supabase.co', 'sb_publishable_Ct4SslgkSqBc5w1IUvWSMg_fvHw7zt4')
const app = document.getElementById('app')
const qs = new URLSearchParams(location.search)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const when = (d) => d ? new Date(d).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London' }) : ''
const STATUS = { with_you: 'Your turn', with_claude: 'With Claude', building: 'Building', ready: 'Quote ready', closed: 'Closed' }
const CO_COL = { RD: 'var(--rd)', MKD: 'var(--mkd)' }
let me = null, companies = [], timer = null

async function start() {
  const { data: { session } } = await sb.auth.getSession()
  if (!session) { app.innerHTML = `<div class="card"><h2>Sign in first</h2><p>Open the hub and sign in, then come back to this page.</p><a class="btn" href="/">Open the hub</a></div>`; return }
  me = session.user
  const { data: mem } = await sb.from('company_members').select('company:companies(id, code, name)').eq('profile_id', me.id).eq('active', true).eq('role', 'director')
  companies = (mem ?? []).map((m) => m.company).filter(Boolean).sort((a, b) => a.code.localeCompare(b.code))
  if (!companies.length) { app.innerHTML = `<div class="card"><h2>Directors only</h2><p class="muted">The quote builder is for directors.</p></div>`; return }
  await loadInstant().catch(() => {})
  route()
}
function route() {
  clearInterval(timer)
  if (qs.get('check')) return costing(null, qs.get('check'))
  if (qs.get('costing')) return costing(qs.get('costing'))
  if (qs.get('b')) return showBrief(qs.get('b'))
  if (qs.get('settings')) return settings()
  if (qs.get('new') || qs.get('job')) return newBrief()
  list()
}
function go(params) { history.pushState(null, '', '?' + new URLSearchParams(params).toString()); for (const k of [...qs.keys()]) qs.delete(k); for (const [k, v] of Object.entries(params)) qs.set(k, v); route() }
window.addEventListener('popstate', () => { const n = new URLSearchParams(location.search); for (const k of [...qs.keys()]) qs.delete(k); for (const [k, v] of n) qs.set(k, v); route() })
document.getElementById('newBtn').onclick = (e) => { e.preventDefault(); go({ new: 1 }) }

function coOf(id) { return companies.find((c) => c.id === id) || {} }
let instant = null
async function loadInstant() { const { data } = await sb.rpc('qb_instant_status'); instant = data || { on: false }; return instant }
function nextRunText() {
  return instant?.on
    ? 'Claude starts on it as soon as you send — usually a few minutes. You’ll get a notification when there are questions or the quote is ready.'
    : 'Claude checks for briefs once an hour — you’ll get a notification when there are questions or the quote is ready.'
}
async function settings() {
  await loadInstant()
  const last = instant.last_at ? `Last start: ${when(instant.last_at)} — ${instant.last_status ? (instant.last_status < 300 ? 'OK' : 'failed (' + instant.last_status + ')') : 'waiting for a reply'}` : ''
  app.innerHTML = `<div class="card"><h2>Instant mode ${instant.on ? '<span class="pill ready">On</span>' : '<span class="pill closed">Off</span>'}</h2>
    <p>With instant mode on, the hub starts Claude on your Claude account the moment you send a brief or answers — no waiting for the hourly check. It uses your Claude subscription, not the API.</p>
    ${last ? `<p class="muted">${esc(last)}</p>${instant.last_body ? `<p class="err">${esc(instant.last_body)}</p>` : ''}` : ''}
    <h3 style="margin-top:14px">${instant.on ? 'Replace the token' : 'Turn it on (one-off, 1 minute)'}</h3>
    <ol style="padding-left:20px;line-height:1.5"><li>Open <a href="https://claude.ai/code/routines" target="_blank">claude.ai/code/routines</a> and open <b>Hub quote builder</b>.</li>
      <li>Under <b>Select a trigger</b> tap <b>Add another trigger</b> → <b>API</b> → <b>Generate token</b>.</li>
      <li>Copy the token (it's only shown once) and paste it below.</li></ol>
    <label for="tok">Token</label><input type="text" id="tok" placeholder="sk-ant-oat01-…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="url">Fire URL <span class="muted">(only if it doesn't end in trig_016XnsaH8e3XtSVidYmaSX4G/fire)</span></label><input type="text" id="url" placeholder="https://api.anthropic.com/v1/claude_code/routines/…/fire" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn full" id="save">Save and test</button><div class="err" id="err"></div><div class="muted" id="res"></div>
    <a class="btn ghost full" href="?" id="back">Back to briefs</a></div>`
  document.getElementById('back').onclick = (e) => { e.preventDefault(); go({}) }
  document.getElementById('save').onclick = async () => {
    const err = document.getElementById('err'), res = document.getElementById('res'); err.textContent = ''; res.textContent = 'Saving…'
    const { error } = await sb.rpc('qb_set_routine_token', { p_token: document.getElementById('tok').value, p_url: document.getElementById('url').value || null })
    if (error) { err.textContent = error.message; res.textContent = ''; return }
    res.textContent = 'Saved. Testing the connection…'
    for (let i = 0; i < 8; i++) {
      await new Promise((r) => setTimeout(r, 2500))
      const s = await loadInstant()
      if (s.last_status) { if (s.last_status < 300) { res.innerHTML = '<span class="ok">Connected — instant mode is on.</span>'; } else { res.textContent = ''; err.textContent = `Claude refused the start (${s.last_status}): ${s.last_body || ''}` } return }
    }
    res.textContent = 'Saved — no reply from Claude yet. Reopen this page in a minute to see the result.'
  }
}

// ---------- list ----------
async function list() {
  const showClosed = qs.get('closed') === '1'
  let q = sb.from('quote_briefs').select('id, company_id, title, status, new_customer, error, updated_at, quote_id, job:jobs(ref, title, customer:customers(display_name))')
    .in('company_id', companies.map((c) => c.id)).order('updated_at', { ascending: false }).limit(80)
  if (!showClosed) q = q.neq('status', 'closed')
  const { data, error } = await q
  if (error) { app.innerHTML = `<div class="card err">${esc(error.message)}</div>`; return }
  const groups = [['with_you', 'Your turn'], ['with_claude', 'With Claude'], ['building', 'Building'], ['ready', 'Quote ready'], ['closed', 'Closed']]
  const row = (b) => {
    const co = coOf(b.company_id)
    const who = b.job ? `${b.job.ref} · ${b.job.customer?.display_name ?? ''}` : [b.new_customer?.first_name, b.new_customer?.last_name].filter(Boolean).join(' ') || 'New customer'
    return `<a class="item" href="?b=${b.id}" data-b="${b.id}"><div class="t"><span><span class="co" style="background:${CO_COL[co.code] || '#999'}"></span>${esc(who)}</span><span class="pill ${b.status}">${STATUS[b.status]}</span></div>
      <div class="muted">${esc(b.title || b.job?.title || '')}${b.error ? ` · <span style="color:var(--warn)">Problem — open to see</span>` : ''} · ${when(b.updated_at)}</div></a>`
  }
  const body = groups.map(([k, label]) => { const rows = (data ?? []).filter((b) => b.status === k); return rows.length ? `<h3>${label}</h3><div class="card">${rows.map(row).join('')}</div>` : '' }).join('')
  app.innerHTML = (body || `<div class="card"><h2>No quotes on the go</h2><p class="muted">Write a brief — what the job is, sizes, materials, anything you noticed on the visit. Claude comes back with multiple-choice questions until it has everything, then builds the branded quote here as a draft for you to check and send.</p><a class="btn" href="?new=1" id="first">Start a brief</a></div>`)
    + `<p class="muted" style="text-align:center;margin-top:18px">${nextRunText()}<br><a href="?${showClosed ? '' : 'closed=1'}" id="tc">${showClosed ? 'Hide closed' : 'Show closed'}</a> · <a href="?settings=1" id="st">Instant mode: ${instant?.on ? 'on' : 'off'}</a></p>`
  app.querySelectorAll('[data-b]').forEach((a) => a.onclick = (e) => { e.preventDefault(); go({ b: a.dataset.b }) })
  const f = document.getElementById('first'); if (f) f.onclick = (e) => { e.preventDefault(); go({ new: 1 }) }
  document.getElementById('tc').onclick = (e) => { e.preventDefault(); go(showClosed ? {} : { closed: 1 }) }
  document.getElementById('st').onclick = (e) => { e.preventDefault(); go({ settings: 1 }) }
  timer = setInterval(() => { if (!document.hidden) list() }, 45000)
}

// ---------- photos: resized on the phone, marked up, each with a note ----------
async function loadImg(src) { return await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src }) }
function toJpeg(cv) {
  let q = 0.78, url = cv.toDataURL('image/jpeg', q)
  while (url.length > 420000 && q > 0.4) { q -= 0.08; url = cv.toDataURL('image/jpeg', q) }
  return url
}
async function resize(file) {
  const src = URL.createObjectURL(file), img = await loadImg(src)
  const max = 1400, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight))
  const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k)
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height)
  URL.revokeObjectURL(src)
  const url = toJpeg(cv)
  return { name: file.name, original: url, marked: null, ops: [], note: '' }
}
const COLS = ['#FF2D2D', '#FFD60A', '#FFFFFF', '#1E90FF', '#111111']
function drawOps(ctx, ops, W) {
  const lw = Math.max(4, W / 180)
  for (const o of ops) {
    ctx.strokeStyle = o.c; ctx.fillStyle = o.c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'
    if (o.t === 'pen') { ctx.beginPath(); o.p.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke() }
    if (o.t === 'box') { ctx.strokeRect(Math.min(o.a[0], o.b[0]), Math.min(o.a[1], o.b[1]), Math.abs(o.b[0] - o.a[0]), Math.abs(o.b[1] - o.a[1])) }
    if (o.t === 'arrow' || o.t === 'dim') {
      const [x1, y1] = o.a, [x2, y2] = o.b, ang = Math.atan2(y2 - y1, x2 - x1), h = lw * 4.5
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke()
      const head = (x, y, a) => { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - h * Math.cos(a - 0.45), y - h * Math.sin(a - 0.45)); ctx.lineTo(x - h * Math.cos(a + 0.45), y - h * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill() }
      head(x2, y2, ang); if (o.t === 'dim') head(x1, y1, ang + Math.PI)
      if (o.t === 'dim' && o.txt) label(ctx, o.txt, (x1 + x2) / 2, (y1 + y2) / 2, o.c, W)
    }
    if (o.t === 'text') label(ctx, o.txt, o.a[0], o.a[1], o.c, W)

async function markup(photo) {
  const img = await loadImg(photo.original)
  const ops = JSON.parse(JSON.stringify(photo.ops || []))
  let tool = 'pen', col = COLS[0], cur = null
  const ov = document.createElement('div')
  ov.setAttribute('style', 'position:fixed;inset:0;z-index:100;background:#111;display:flex;flex-direction:column;touch-action:none')
  ov.innerHTML = `<div style="display:flex;gap:6px;flex-wrap:wrap;padding:10px;padding-top:calc(10px + env(safe-area-inset-top));align-items:center;background:#1B1F23">
      ${[['pen', '✎ Draw'], ['arrow', '➜ Arrow'], ['dim', '↔ Measure'], ['box', '▢ Box'], ['text', 'T Label']].map(([k, l]) => `<button data-tool="${k}" class="btn small ${k === 'pen' ? '' : 'ghost'}">${l}</button>`).join('')}

    <div style="flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden"><canvas style="max-width:100%;max-height:100%;touch-action:none"></canvas></div>
    <div class="muted" id="mk-hint" style="color:#bbb;text-align:center;padding:4px 10px">Draw on the photo. Measure: drag along the length, then type the size.</div>
    <div style="display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#1B1F23">
      <button class="btn ghost small" id="mk-undo">Undo</button><button class="btn ghost small" id="mk-clear">Clear</button><span style="flex:1"></span>
      <button class="btn ghost small" id="mk-cancel">Cancel</button><button class="btn small" id="mk-done">Done</button></div>`
  document.body.appendChild(ov)
  const cv = ov.querySelector('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight
  const ctx = cv.getContext('2d')
  const redraw = () => { ctx.drawImage(img, 0, 0); drawOps(ctx, cur ? [...ops, cur] : ops, cv.width) }
  redraw()
  const pt = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height] }
  ov.querySelectorAll('[data-tool]').forEach((b) => b.onclick = () => { tool = b.dataset.tool; ov.querySelectorAll('[data-tool]').forEach((x) => x.classList.toggle('ghost', x !== b)) })
  ov.querySelectorAll('[data-col]').forEach((b) => b.onclick = () => { col = b.dataset.col; ov.querySelectorAll('[data-col]').forEach((x) => x.style.border = x === b ? '3px solid #2F6FEB' : '2px solid #555') })
  cv.onpointerdown = (e) => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId); const p = pt(e)
    if (tool === 'text') { const t = prompt('Label text (e.g. 5.2m, drain here, remove this)'); if (t && t.trim()) { ops.push({ t: 'text', c: col, a: p, txt: t.trim() }); redraw() } return }
    cur = tool === 'pen' ? { t: 'pen', c: col, p: [p] } : { t: tool, c: col, a: p, b: p }
  }
  cv.onpointermove = (e) => { if (!cur) return; e.preventDefault(); const p = pt(e); if (cur.t === 'pen') cur.p.push(p); else cur.b = p; redraw() }
  cv.onpointerup = () => {
    if (!cur) return
    const c = cur; cur = null
    const len = c.t === 'pen' ? c.p.length : Math.hypot(c.b[0] - c.a[0], c.b[1] - c.a[1])
    if ((c.t === 'pen' && len > 1) || (c.t !== 'pen' && len > 12)) {
      if (c.t === 'dim') { const t = prompt('What does it measure? (e.g. 6.1m)'); c.txt = (t || '').trim() }
      ops.push(c)

  }

  ov.querySelector('#mk-clear').onclick = () => { if (ops.length && confirm('Clear all mark-up on this photo?')) { ops.length = 0; redraw() } }
  return await new Promise((res) => {
    ov.querySelector('#mk-cancel').onclick = () => { ov.remove(); res(false) }
    ov.querySelector('#mk-done').onclick = () => {
      cur = null; redraw()
      photo.ops = ops; photo.marked = ops.length ? toJpeg(cv) : null
      ov.remove(); res(true)
    }
  })
}

const KINDS = [['materials', 'Materials'], ['labour', 'Labour'], ['plant', 'Plant & hire'], ['waste', 'Waste & muck-away'], ['other', 'Other']]
const SRC = { checked: ['Checked', '#166534', '#DCFCE7'], est: ['EST', '#92400E', '#FEF3C7'], given: ['Your rate', '#1D4ED8', '#E8F0FE'] }
const gbp = (n) => (n < 0 ? '-£' : '£') + Math.abs(Number(n) || 0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
const num = (v) => v === '' || v == null ? null : Number(v)
function lineQty(l) { return num(l.men) != null && num(l.days) != null ? num(l.men) * num(l.days) : (num(l.qty) ?? 0) }
function lineCost(l) { return Math.round(lineQty(l) * (num(l.rate) ?? 0) * (l.vat ? 1.2 : 1) * 100) / 100 }
function optTotals(o) {
  const live = (o.lines ?? []).filter((l) => !l.removed)
  const cost = Math.round(live.reduce((s, l) => s + lineCost(l), 0) * 100) / 100
  const price = num(o.price) ?? 0
  const manDays = live.filter((l) => l.kind === 'labour').reduce((s, l) => s + (num(l.men) ?? 0) * (num(l.days) ?? 0), 0)
  const target = num(o.target_margin_pct) ?? 20
  return { cost, price, profit: Math.round((price - cost) * 100) / 100, margin: cost > 0 ? Math.round((price / cost - 1) * 1000) / 10 : null,
    atTarget: Math.round(cost * (1 + target / 100) * 100) / 100, manDays, target }
}

      const body = approve
        ? `Approved price build-up${summary ? ' — with my changes:\n' + summary : ' as sent.'}${comment ? `\n\nComment: ${comment}` : ''}`
        : `Price build-up changes (price check) — please re-check and send a new price check:\n${summary || '(no figure changes)'}${comment ? `\n\nComment: ${comment}` : ''}`
      const { error } = await sb.from('quote_brief_messages').insert({ brief_id: brief, role: 'lewis', body, costing: toSave })
      if (error) { err.textContent = error.message; return }
      go({ b: brief })
    }
    const ap = document.getElementById('approve')
    if (ap) { ap.onclick = () => reply(true); document.getElementById('send').onclick = () => reply(false); return }
    const save = async (send) => {
      const err = document.getElementById('err'); err.textContent = ''
      const summary = diffSummary()
      if (send && !summary && !(d._comment || '').trim()) { err.textContent = 'Nothing has changed yet.'; return }
      const toSave = clone(d); delete toSave._comment
      const { error } = await sb.rpc('qc_save', { p_quote: quoteId, p: toSave, p_note: send ? 'Sent to Claude' : 'Saved' })
      if (error) { err.textContent = error.message; return }
      if (send) {
        const body = `Price build-up changes for ${q.ref} rev ${q.revision} — build the next revision from these:\n${summary || '(no figure changes)'}${(d._comment || '').trim() ? `\n\nGeneral: ${d._comment.trim()}` : ''}`
        const { error: e2 } = await sb.from('quote_brief_messages').insert({ brief_id: brief, role: 'lewis', body })
        if (e2) { err.textContent = 'Saved, but not sent: ' + e2.message; return }
        go({ b: brief }); return
      }
      costing(quoteId)
    }
    const s1 = document.getElementById('send'); if (s1) s1.onclick = () => save(true)
    const s2 = document.getElementById('save'); if (s2) s2.onclick = () => save(false)
  }
  function keepOpen(fn) {
    const open = [...app.querySelectorAll('details')].map((x) => x.open), y = scrollY
    fn(); app.querySelectorAll('details').forEach((x, i) => { if (open[i]) x.open = true }); scrollTo(0, y)
  }
  function diffSummary() {
    const out = []
    ;(d.options ?? []).forEach((o, oi) => {
      const b = orig.options?.[oi] ?? { lines: [] }
      const t = optTotals(o), tb = optTotals(b)
      const lines = []
      if (num(o.price) !== num(b.price)) lines.push(`  • Customer price ${gbp(b.price)} → ${gbp(o.price)}`)
      o.lines.forEach((l, li) => {
        const bl = b.lines?.[li]
        if (!bl) { lines.push(`  • ADDED ${l.kind}: ${l.description} — ${l.kind === 'labour' ? `${l.men} men × ${l.days} days × ${gbp(l.rate)}` : `${l.qty} ${l.unit} × ${gbp(l.rate)}${l.vat ? ' + VAT' : ''}`} = ${gbp(lineCost(l))}${l.comment ? ` (“${l.comment}”)` : ''}`); return }
        if (l.removed) { lines.push(`  • TAKE OUT: ${bl.description} (${gbp(lineCost(bl))})${l.comment ? ` — “${l.comment}”` : ''}`); return }
        const ch = ['description', 'men', 'days', 'qty', 'rate', 'vat'].filter((f) => String(bl[f] ?? '') !== String(l[f] ?? '')).map((f) => `${f} ${bl[f] ?? '—'} → ${l[f] ?? '—'}`)
        if (ch.length) lines.push(`  • ${bl.description}: ${ch.join(', ')} (${gbp(lineCost(bl))} → ${gbp(lineCost(l))})`)
        if ((l.comment ?? '') !== (bl.comment ?? '') && l.comment) lines.push(`  • Comment on ${l.description}: “${l.comment}”`)
      })
      if (lines.length) out.push(`${o.name}: cost ${gbp(tb.cost)} → ${gbp(t.cost)}, price ${gbp(tb.price)} → ${gbp(t.price)} (${t.margin ?? '—'}% on cost)\n${lines.join('\n')}`)
    })
    return out.join('\n\n')
  }
  render()
}

// ---------- before & after visuals for the quote (OpenAI, via Make) ----------
// A director picks/uploads the before photo, marks it up and says what to change; the photo-real after comes back in
// about a minute. Mark the after up again and send as many rounds as it takes. Only an approved round goes on the quote.
const VST = { queued: ['Making it…', 'vgo'], generating: ['Making it…', 'vgo'], ready: ['Ready to check', 'vchk'], approved: ['On the quote ✓', 'vok'], failed: ['Failed', 'vbad'] }
const vImg = new Map()
async function vGet(id, col) {
  const k = id + col; if (vImg.has(k)) return vImg.get(k)
  const { data } = await sb.from('quote_visuals').select(col).eq('id', id).maybeSingle()
  const u = data?.[col] ? 'data:image/jpeg;base64,' + data[col] : null
  if (u) vImg.set(k, u); return u
}
async function resizeBig(file) {
  const src = URL.createObjectURL(file), img = await loadImg(src)
  const k = Math.min(1, 2048 / Math.max(img.naturalWidth, img.naturalHeight))
  const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k)
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(src)
  let q = 0.9, url = cv.toDataURL('image/jpeg', q)
  while (url.length > 1800000 && q > 0.5) { q -= 0.08; url = cv.toDataURL('image/jpeg', q) }
  return url
}
function vView(src, caption) {
  const ov = document.createElement('div')
  ov.setAttribute('style', 'position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;color:#fff')
  ov.innerHTML = `<img src="${src}" style="max-width:100%;max-height:82vh;border-radius:6px">${caption ? `<div style="margin-top:10px">${esc(caption)}</div>` : ''}<div class="muted" style="margin-top:8px;color:#aaa">Tap anywhere to close</div>`
  document.body.appendChild(ov); ov.onclick = () => ov.remove()
}
// the "send a round" form: mark-up on the image, say what to change
async function vCompose({ brief, baseUrl, parent = null, sourceFile = null, title = '', heading }) {
  const photo = { original: baseUrl, marked: null, ops: [], note: '' }
  const ov = document.createElement('div')
  ov.setAttribute('style', 'position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto')
  const draw = () => {
    ov.innerHTML = `<header style="position:sticky"><a href="#" id="vx-x" aria-label="Close">‹</a><h1>${esc(heading)}</h1></header><div class="wrap">
      <div class="card"><img src="${photo.marked || photo.original}" id="vx-img" style="width:100%;border-radius:8px;display:block;cursor:pointer">
        <div class="acts"><button class="btn ghost small" id="vx-mk">${photo.marked ? '✎ Edit mark-up' : '✎ Mark it up'}</button>${photo.marked ? '<button class="btn ghost small" id="vx-cl">Clear mark-up</button>' : ''}</div>
        <p class="muted" style="margin-bottom:0">Draw, arrow, box and label where things go — colours are fine, they won't appear in the picture.</p>
        ${parent ? '' : `<label for="vx-t">What is this view? <span class="muted">(shown on the quote)</span></label><input type="text" id="vx-t" value="${esc(title)}" placeholder="e.g. Front driveway, from the road">`}
        <label for="vx-i">${parent ? 'What needs changing?' : 'What should the finished job look like?'}</label>
        <textarea id="vx-i" style="min-height:130px" placeholder="${parent ? 'e.g. Border should be charcoal not grey, make the gravel lighter, keep the hedge on the right' : 'e.g. Silver-grey gravel in a grid, grey block border two blocks wide, granite-effect edging standing 25mm proud, hedge at the entrance removed'}"></textarea>
        <button class="btn full" id="vx-go">Make the after image</button><div class="err" id="vx-err"></div>
        <p class="muted">Takes about a minute. You get a notification when it's back. Nothing goes on a quote until a director approves it.</p></div></div>`
    ov.querySelector('#vx-x').onclick = (e) => { e.preventDefault(); ov.remove() }
    const mk = async () => { const keep = [ov.querySelector('#vx-i').value, ov.querySelector('#vx-t')?.value]; if (await markup(photo)) { draw(); ov.querySelector('#vx-i').value = keep[0]; const t = ov.querySelector('#vx-t'); if (t) t.value = keep[1] ?? '' } }
    ov.querySelector('#vx-mk').onclick = mk; ov.querySelector('#vx-img').onclick = mk
    const cl = ov.querySelector('#vx-cl'); if (cl) cl.onclick = () => { photo.marked = null; photo.ops = []; draw() }
    ov.querySelector('#vx-go').onclick = async () => {
      const err = ov.querySelector('#vx-err'), ins = ov.querySelector('#vx-i').value.trim(), t = ov.querySelector('#vx-t')?.value.trim()
      if (ins.length < 5) { err.textContent = 'Say what you want to see.'; return }
      if (!parent && !t) { err.textContent = 'Give this view a name, e.g. Front driveway.'; return }
      const btn = ov.querySelector('#vx-go'); btn.disabled = true; btn.textContent = 'Sending…'
      const b64 = (u) => u ? u.split(',')[1] : null
      const { error } = await sb.rpc('qv_request', { p_brief: brief, p_instruction: ins, p_source_file: sourceFile, p_parent: parent,
        p_base_b64: parent || sourceFile ? null : b64(photo.original), p_marked_b64: b64(photo.marked), p_title: t || null })
      if (error) { err.textContent = error.message; btn.disabled = false; btn.textContent = 'Make the after image'; return }
      ov.remove(); vRefresh(brief)
    }
  }
  document.body.appendChild(ov); draw()
}
let vTimer = null, vSel = {}
async function vRefresh(brief) {
  const box = document.getElementById('visuals'); if (!box) return
  const { data: rows, error } = await sb.from('quote_visuals').select('id, chain_id, round, status, title, instruction, error, created_at, done_at, approved_at').eq('brief_id', brief).order('created_at')
  if (error) { box.innerHTML = `<div class="err">${esc(error.message)}</div>`; return }
  const chains = []; for (const r of rows ?? []) { let c = chains.find((x) => x.id === r.chain_id); if (!c) chains.push(c = { id: r.chain_id, rounds: [] }); c.rounds.push(r) }
  const busy = (rows ?? []).some((r) => r.status === 'queued' || r.status === 'generating')
  box.innerHTML = `<h2>Before &amp; after for the quote</h2>
    ${chains.length ? '' : `<p class="muted" style="margin-top:0">Show the customer their own home finished. Pick a site photo, mark it up and say what you want — a photo-real after image comes back in about a minute. Change it as many times as you like; only the ones you approve go on the quote.</p>`}
    ${chains.map((c) => {
      const latest = c.rounds[c.rounds.length - 1], appr = c.rounds.find((r) => r.status === 'approved')
      const sel = c.rounds.find((r) => r.id === vSel[c.id]) || latest
      const head = appr ? VST.approved : VST[latest.status]
      return `<div class="vx" id="vx-${c.id}"><div class="vh"><b>${esc(c.rounds[0].title || 'View')}</b><span class="pill ${head[1]}">${head[0]}</span></div>
        <div class="vpair"><figure><img data-vimg="${c.rounds[0].id}:base_b64" alt="Before"><figcaption>Before</figcaption></figure>
          <figure>${sel.status === 'queued' || sel.status === 'generating' ? `<div class="vwait"><span><span class="vsp"></span>Making round ${sel.round}…<br><span style="font-size:12px">about a minute</span></span></div>`
            : sel.status === 'failed' ? `<div class="vwait" style="color:var(--warn)">${esc(sel.error || 'Failed')}</div>`
            : `<img data-vimg="${sel.id}:after_b64" alt="After"><figcaption>After · round ${sel.round}${sel.status === 'approved' ? ' ✓' : ''}</figcaption>`}</figure></div>
        ${c.rounds.length > 1 ? `<div class="vrounds">${c.rounds.map((r) => `<button data-vsel="${c.id}:${r.id}" class="${r.id === sel.id ? 'on' : ''} ${r.status === 'approved' ? 'ap' : ''}">Round ${r.round}${r.status === 'approved' ? ' ✓' : r.status === 'failed' ? ' ✕' : ''}</button>`).join('')}</div>` : ''}
        <div class="vins"><b>Round ${sel.round}:</b> ${esc(sel.instruction)}</div>
        <div class="acts">
          ${sel.status === 'ready' ? `<button class="btn small" style="background:var(--ok)" data-vap="${sel.id}">✓ Use on the quote</button>` : ''}
          ${sel.status === 'approved' ? `<button class="btn ghost small" data-vun="${sel.id}">Take off the quote</button>` : ''}
          ${(sel.status === 'ready' || sel.status === 'approved') && !(latest.status === 'queued' || latest.status === 'generating') ? `<button class="btn ghost small" data-vre="${c.id}:${sel.id}">✎ Mark up &amp; change</button>` : ''}
          ${sel.status === 'failed' ? `<button class="btn small" data-vtry="${sel.id}">Try again</button>` : ''}
        </div></div>`
    }).join('')}
    <button class="btn ghost full" id="vnew">＋ New before &amp; after</button>`
  box.querySelectorAll('[data-vimg]').forEach(async (im) => { const [id, col] = im.dataset.vimg.split(':'); const u = await vGet(id, col); if (u) { im.src = u; im.onclick = () => vView(u, im.alt) } })
  box.querySelectorAll('[data-vsel]').forEach((b) => b.onclick = () => { const [c, r] = b.dataset.vsel.split(':'); vSel[c] = r; vRefresh(brief) })
  box.querySelectorAll('[data-vap]').forEach((b) => b.onclick = async () => {
    if (!confirm('Use this after image on the quote?\n\nCheck it looks right — scale, materials, colours, and nothing changed that shouldn\'t be. It will be labelled on the quote as an illustration of the finished work.')) return
    const { error } = await sb.rpc('qv_approve', { p_id: b.dataset.vap }); if (error) return alert(error.message); vRefresh(brief)
  })
  box.querySelectorAll('[data-vun]').forEach((b) => b.onclick = async () => { const { error } = await sb.rpc('qv_unapprove', { p_id: b.dataset.vun }); if (error) return alert(error.message); vRefresh(brief) })
  box.querySelectorAll('[data-vtry]').forEach((b) => b.onclick = async () => { const { error } = await sb.rpc('qv_retry', { p_id: b.dataset.vtry }); if (error) return alert(error.message); vRefresh(brief) })
  box.querySelectorAll('[data-vre]').forEach((b) => b.onclick = async () => {
    const [cid, rid] = b.dataset.vre.split(':'), r = (rows ?? []).find((x) => x.id === rid)
    const u = await vGet(rid, 'after_b64'); if (!u) return
    vCompose({ brief, baseUrl: u, parent: rid, heading: `${r?.title || 'View'} · round ${(chains.find((c) => c.id === cid)?.rounds.length ?? 1) + 1}` })
  })
  document.getElementById('vnew').onclick = () => vPickSource(brief)
  clearTimeout(vTimer); if (busy) vTimer = setTimeout(() => { if (document.getElementById('visuals')) vRefresh(brief) }, 6000)
  const want = qs.get('v'); if (want && document.getElementById('vx-' + want)) { document.getElementById('vx-' + want).scrollIntoView({ behavior: 'smooth', block: 'center' }); qs.delete('v') }
}

  const [{ data: b, error }, { data: msgs }, { data: files }] = await Promise.all([
    sb.from('quote_briefs').select('*, job:jobs(id, ref, title, site_address, site_postcode, customer:customers(display_name)), quote:quotes!quote_briefs_quote_id_fkey(id, ref, revision, status, document_path, qb_hold, qb_signed_off_at)').eq('id', id).maybeSingle(),
    sb.from('quote_brief_messages').select('*').eq('brief_id', id).order('id'),
    sb.from('quote_brief_files').select('id, message_id, mime, data_b64, original_b64, note, marked').eq('brief_id', id).order('created_at'),
  ])
  if (error || !b) { app.innerHTML = `<div class="card err">${esc(error?.message || 'Brief not found.')}</div>`; return }
  const co = coOf(b.company_id)
  const who = b.job ? `${b.job.ref} · ${b.job.customer?.display_name ?? ''}` : [b.new_customer?.first_name, b.new_customer?.last_name].filter(Boolean).join(' ')
  const byMsg = new Map(); for (const f of files ?? []) { const k = f.message_id ?? 0; byMsg.set(k, [...(byMsg.get(k) ?? []), f]) }
  const lastQ = [...(msgs ?? [])].reverse().find((m) => m.role === 'claude' && m.questions?.length)
  const answered = lastQ && (msgs ?? []).some((m) => m.role === 'lewis' && m.id > lastQ.id)
  const lastC = [...(msgs ?? [])].reverse().find((m) => m.role === 'claude' && m.costing)
  const checkOpen = b.status === 'with_you' && lastC && !(msgs ?? []).some((m) => m.id > lastC.id)
  const open = b.status === 'with_you' && lastQ && !answered && !(lastC && lastC.id > lastQ.id)
  const costSummary = (cd) => `<div class="csum">${(cd.options ?? []).map((o) => { const t = optTotals(o); return `<div><b>${gbp(t.price)}</b><span>${esc(o.name)}${o.optional ? ' (extra)' : ''} · cost ${gbp(t.cost)} · ${t.margin ?? '—'}%</span></div>` }).join('')}</div>`

  const ansText = (m) => {
    if (!m.answers) return ''
    const q = (msgs ?? []).find((x) => x.id === m.answers_to)
    return `<div class="ans">${Object.entries(m.answers).map(([k, v]) => {
      const qq = q?.questions?.find((x) => String(x.id) === String(k))
      return `<div>• <b>${esc(qq?.q || k)}</b><br>&nbsp;&nbsp;${esc(Array.isArray(v) ? v.join(', ') : v)}</div>`
    }).join('')}</div>`
  }
  const thread = (msgs ?? []).map((m) => {
    if (m.role === 'claude' && m.questions?.length && m === lastQ && open) return `<div class="msg claude"><div class="who">Claude · ${when(m.created_at)}</div>${m.body ? `<div class="b">${esc(m.body)}</div>` : ''}</div>`
    const qsHtml = m.role === 'claude' && m.questions?.length ? `<div style="margin-top:8px">${m.questions.map((q, i) => `<div>${i + 1}. ${esc(q.q)}</div>`).join('')}</div>` : ''
    if (m.costing) return `<div class="msg ${m.role}"><div class="who">${m.role === 'claude' ? 'Claude' : 'You'} · ${when(m.created_at)}</div>
      <div class="b">${esc(m.role === 'claude' ? (m.body || 'Price check') : m.body)}${m.role === 'claude' ? costSummary(m.costing) : ''}
      <div style="margin-top:8px"><a href="#" data-check="${m.id}" style="color:${m.role === 'claude' ? 'var(--accent)' : '#9CC3FF'};font-weight:600">${m.role === 'claude' ? (m === lastC && checkOpen ? 'Open the price check →' : 'View this price check') : 'View the build-up you sent'}</a></div></div></div>`
    const pics = (byMsg.get(m.id) ?? []).map((f) => `<figure class="tf" data-f="${f.id}"><img src="data:${f.mime || 'image/jpeg'};base64,${f.data_b64}">${f.note ? `<figcaption>${esc(f.note)}</figcaption>` : ''}</figure>`).join('')
    return `<div class="msg ${m.role}"><div class="who">${m.role === 'claude' ? 'Claude' : 'You'} · ${when(m.created_at)}</div>
      <div class="b">${esc(m.body || (m.answers ? 'My answers:' : ''))}${qsHtml}${ansText(m)}</div>${pics ? `<div class="thumbs">${pics}</div>` : ''}</div>`
  }).join('')

  const statusBox = {
    with_claude: `With Claude. ${nextRunText()}`,
    building: 'Claude is building the quote now.',
    with_you: checkOpen ? 'Price check ready — open it, change any line you want, then approve or send changes back.' : open ? 'Claude has questions — answer them below.' : 'Waiting for you.',
    ready: b.quote?.qb_signed_off_at ? 'Signed off — you can now send it from the quote screen. Want changes? Write them below and Claude will do a new revision.' : 'The draft quote is HELD. Open the PDF, check every page and figure, then tap Sign off. Until a director signs it off it cannot be sent and the customer can’t see it. Want changes? Write them below and Claude will do a new revision.',
    closed: 'Closed.',
  }[b.status]
  const held = b.quote?.qb_hold && !b.quote?.qb_signed_off_at
  let cost = null, opened = false
  if (b.quote) {
    const [{ data: cc }, { data: vw }] = await Promise.all([
      sb.from('quote_costings').select('version, data').eq('quote_id', b.quote.id).maybeSingle(),
      sb.from('quote_costing_views').select('first_at').eq('quote_id', b.quote.id).eq('profile_id', me.id).maybeSingle(),
    ])
    cost = cc; opened = !!vw
  }
  const tot = cost ? (cost.data.options ?? []).filter((o) => !o.optional).map((o) => ({ name: o.name, ...optTotals(o) })) : []
  const quoteCard = b.quote ? `<div class="card"><h2>${esc(b.quote.ref)} rev ${esc(b.quote.revision)}</h2>
    <div class="muted">${esc(b.quote.status === 'draft' ? 'Draft' : b.quote.status)}</div>
    ${held ? `<div class="status with_you" style="margin:10px 0 0"><b>Held — not signed off.</b> It can’t be sent and the customer can’t open it until a director signs it off.</div>`
      : b.quote.qb_signed_off_at ? `<div class="status ready" style="margin:10px 0 0"><b>Signed off</b> · ${when(b.quote.qb_signed_off_at)}</div>` : ''}
    ${cost ? `<div class="csum">${tot.map((t) => `<div><b>${gbp(t.price)}</b><span>${esc(t.name)} · cost ${gbp(t.cost)} · ${t.margin ?? '—'}%</span></div>`).join('')}</div>`
      : `<div class="muted" style="margin-top:8px">No price build-up yet${held ? ' — it can’t be signed off without one.' : '.'}</div>`}
    <div class="acts">${b.quote.document_path ? `<button class="btn ${held ? '' : 'ghost'} small" id="pdf">View the PDF</button>` : ''}
      ${cost ? `<button class="btn ${held && !opened ? '' : 'ghost'} small" id="costbtn">£ Price build-up</button>` : ''}
      ${held && b.quote.status === 'draft' ? `<button class="btn small" id="signoff" style="background:var(--ok)" ${cost && opened ? '' : 'disabled'}>✓ Sign off</button>` : ''}
      <a class="btn ghost small" href="/quotes/${b.quote.id}">Open the quote</a>${b.job ? `<a class="btn ghost small" href="/jobs/${b.job.id}">Open the job</a>` : ''}</div>
    ${held && !(cost && opened) ? `<div class="muted" style="margin-top:6px">${cost ? 'Open the price build-up to check it — then you can sign off.' : ''}</div>` : ''}
    <div class="err" id="soerr"></div></div>` : ''

  const ph = photoPicker('ph2')
  app.innerHTML = `<div class="card" style="margin-top:4px"><div class="muted"><span class="co" style="background:${CO_COL[co.code] || '#999'}"></span>${esc(co.name)}</div>
      <h2 style="margin:4px 0 2px">${esc(who || 'New customer')}</h2><div class="muted">${esc(b.title || b.job?.title || '')}</div>
      <div class="acts"><a class="btn ghost small" href="?" id="back">All briefs</a>${b.status !== 'closed' ? `<button class="btn ghost small" id="close">Close brief</button>` : `<button class="btn ghost small" id="reopen">Reopen</button>`}</div></div>
    ${b.error ? `<div class="status with_you"><b>Problem on the last run:</b> ${esc(b.error)}<br><span class="muted">Reply below and Claude picks it up on the next run.</span></div>` : ''}
    <div class="status ${b.status}">${statusBox}</div>
    ${quoteCard}
    ${checkOpen ? `<div class="card"><h2>Price check</h2>${costSummary(lastC.costing)}
      <button class="btn full" data-check="${lastC.id}">Open the price check</button>
      <p class="muted" style="margin-bottom:0">Every cost line, labour days and source, laid out line by line. Edit or comment on any line, then approve.</p></div>` : ''}
    <div class="card" id="visuals"><p class="muted">Loading before &amp; after…</p></div>
    <div id="thread">${thread}</div>
    ${open ? `<div class="card" id="qa"><h2>Claude's questions</h2>${lastQ.questions.map((q, i) => `
      <div class="q" data-q="${esc(q.id)}" data-multi="${q.multi ? 1 : 0}"><div class="qt"><span class="qn">${i + 1}.</span>${esc(q.q)}${q.multi ? ' <span class="muted">(pick any)</span>' : ''}</div>
        <div class="opts">${(q.options ?? []).map((o) => `<button class="opt ${q.multi ? 'multi' : ''}" data-v="${esc(o)}"><span class="mk"></span><span>${esc(o)}</span></button>`).join('')}</div>
        ${q.other !== false ? `<input type="text" class="other" placeholder="Or type your own answer">` : ''}</div>`).join('')}
      <label for="extra">Anything else? <span class="muted">(optional)</span></label><textarea id="extra" style="min-height:70px"></textarea>
      ${ph.html}
      <button class="btn full" id="send">Send answers</button><div class="err" id="err"></div></div>`
    : b.status !== 'closed' ? `<div class="card"><label for="more" style="margin-top:0">${b.status === 'ready' ? 'Changes for a new revision' : 'Add more detail'}</label><textarea id="more" style="min-height:80px"></textarea>${ph.html}
      <button class="btn full" id="send2">Send to Claude</button><div class="err" id="err"></div></div>` : ''}`
  ph.wire()
  vRefresh(id)
  app.querySelectorAll('[data-check]').forEach((el) => el.onclick = (e) => { e.preventDefault(); go({ check: el.dataset.check, b: id }) })
  app.querySelectorAll('[data-f]').forEach((el) => el.onclick = () => viewPhoto((files ?? []).find((f) => f.id === el.dataset.f)))
  document.getElementById('back').onclick = (e) => { e.preventDefault(); go({}) }
  const cbt = document.getElementById('costbtn'); if (cbt) cbt.onclick = () => go({ costing: b.quote.id })
  const so = document.getElementById('signoff')
  if (so) so.onclick = async () => {
    if (!confirm(`Sign off ${b.quote.ref} rev ${b.quote.revision} at ${tot.map((t) => gbp(t.price) + ' (' + (t.margin ?? '—') + '% on cost)').join(' / ')}?\n\nOnly sign off once you've opened the PDF and checked every page — names, address, scope and every price.\n\nThis doesn't send it. You still send it yourself from the quote screen.`)) return
    so.disabled = true; so.textContent = 'Signing off…'
    const { error } = await sb.rpc('qb_sign_off', { p_quote: b.quote.id })
    if (error) { document.getElementById('soerr').textContent = error.message; so.disabled = false; so.textContent = '✓ Sign off'; return }
    showBrief(id)
  }
  const pdf = document.getElementById('pdf')
  if (pdf) pdf.onclick = async () => { const { data } = await sb.storage.from('documents').createSignedUrl(b.quote.document_path, 600); if (data) location.href = data.signedUrl }
  const cl = document.getElementById('close'); if (cl) cl.onclick = async () => { if (!confirm('Close this brief? Nothing is deleted — you can reopen it.')) return; await sb.from('quote_briefs').update({ status: 'closed', updated_at: new Date().toISOString() }).eq('id', id); showBrief(id) }
  const ro = document.getElementById('reopen'); if (ro) ro.onclick = async () => { await sb.from('quote_briefs').update({ status: b.quote_id ? 'ready' : 'with_you', updated_at: new Date().toISOString() }).eq('id', id); showBrief(id) }

  if (open) {
    document.querySelectorAll('.q').forEach((qe) => {
      const multi = qe.dataset.multi === '1'
      qe.querySelectorAll('.opt').forEach((o) => o.onclick = () => {
        if (multi) o.classList.toggle('on')
        else { qe.querySelectorAll('.opt').forEach((x) => x.classList.toggle('on', x === o)); const ot = qe.querySelector('.other'); if (ot) ot.value = '' }
      })
      const ot = qe.querySelector('.other'); if (ot && !multi) ot.oninput = () => { if (ot.value) qe.querySelectorAll('.opt').forEach((x) => x.classList.remove('on')) }
    })
    document.getElementById('send').onclick = async () => {
      const err = document.getElementById('err'); err.textContent = ''
      const answers = {}, missing = []
      document.querySelectorAll('.q').forEach((qe, i) => {
        const picked = [...qe.querySelectorAll('.opt.on')].map((o) => o.dataset.v)
        const other = qe.querySelector('.other')?.value.trim()
        const v = other ? [...picked, other] : picked
        if (!v.length) missing.push(i + 1); else answers[qe.dataset.q] = qe.dataset.multi === '1' ? v : v[v.length - 1]
      })
      if (missing.length) { err.textContent = `Answer question ${missing.join(', ')} first (or type “don’t know”).`; return }
      const btn = document.getElementById('send'); btn.disabled = true; btn.textContent = 'Sending…'
      const { data: m, error: e2 } = await sb.from('quote_brief_messages').insert({ brief_id: id, role: 'lewis', body: document.getElementById('extra').value.trim() || null, answers, answers_to: lastQ.id }).select('id').single()
      if (e2) { err.textContent = e2.message; btn.disabled = false; btn.textContent = 'Send answers'; return }
      try { await savePhotos(id, m.id, ph.st.files) } catch (e) { alert('Answers sent, but a photo failed: ' + e.message) }
      showBrief(id); scrollTo({ top: 0, behavior: 'smooth' })
    }
  }
  const s2 = document.getElementById('send2')
  if (s2) s2.onclick = async () => {
    const err = document.getElementById('err'), t = document.getElementById('more').value.trim()
    if (!t && !ph.st.files.length) { err.textContent = 'Write something first.'; return }
    s2.disabled = true; s2.textContent = 'Sending…'
    const { data: m, error: e2 } = await sb.from('quote_brief_messages').insert({ brief_id: id, role: 'lewis', body: t || 'Photos added.' }).select('id').single()
    if (e2) { err.textContent = e2.message; s2.disabled = false; s2.textContent = 'Send to Claude'; return }
    try { await savePhotos(id, m.id, ph.st.files) } catch (e) { alert('Sent, but a photo failed: ' + e.message) }
    showBrief(id)
  }
  // refresh while waiting on Claude (keeps your typing: only when nothing is being answered)
  timer = setInterval(async () => {
    if (document.hidden || open || document.getElementById('more')?.value) return
    const { data: x } = await sb.from('quote_briefs').select('status, updated_at').eq('id', id).maybeSingle()
    if (x && (x.status !== b.status || x.updated_at !== b.updated_at)) showBrief(id)
  }, 30000)
}

start()
</script>
</body>
</html>
